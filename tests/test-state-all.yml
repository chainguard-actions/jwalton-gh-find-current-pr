name: Test state=all filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: find-pr
        uses: .
        with:
          state: all
        continue-on-error: true

      - name: Assert action ran with state=all
        env:
          OUTCOME: ${{ steps.find-pr.outcome }}
          PR_NUMBER: ${{ steps.find-pr.outputs.number }}
          PR_DEPRECATED: ${{ steps.find-pr.outputs.pr }}
          PR_TITLE: ${{ steps.find-pr.outputs.title }}
          PR_BODY: ${{ steps.find-pr.outputs.body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $PR_NUMBER"
          echo "pr (deprecated): $PR_DEPRECATED"
          echo "title: $PR_TITLE"
          echo "body: $PR_BODY"

          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with state=all"
            # If a PR was found, validate output consistency
            if [ -n "$PR_NUMBER" ]; then
              if [ "$PR_NUMBER" != "$PR_DEPRECATED" ]; then
                echo "FAIL: 'number' ($PR_NUMBER) and deprecated 'pr' ($PR_DEPRECATED) outputs should match"
                exit 1
              fi
              echo "PASS: PR found with number=$PR_NUMBER"
            else
              echo "PASS: no PR found for this SHA with state=all (expected on harness)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

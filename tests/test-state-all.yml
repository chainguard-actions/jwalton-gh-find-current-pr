name: Test state=all - find PR in any state
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: find-pr
        uses: .
        continue-on-error: true
        with:
          state: all

      - name: Assert action ran with state=all and produced expected outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.find-pr.outcome }}
          PR_NUMBER: ${{ steps.find-pr.outputs.number }}
          PR_TITLE: ${{ steps.find-pr.outputs.title }}
          PR_BODY: ${{ steps.find-pr.outputs.body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr number: $PR_NUMBER"
          echo "pr title: $PR_TITLE"
          echo "pr body: $PR_BODY"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with state=all (number='$PR_NUMBER')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
